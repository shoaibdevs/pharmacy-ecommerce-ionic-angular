<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title  style="text-align: center;">Som Medicose</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Som Medicose</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-skeleton-text *ngIf="!bannerData" animated style="min-height: 180px; ">
  </ion-skeleton-text>
  <swiper-container
  *ngIf="bannerData"
  #swiper
  (afterinit)="swiperReady()"
  (slidechange)="swiperSlideChanged($event)"
  [loop]="true"
  [pagination]="true"
  [zoom]="true"
>
  <swiper-slide   *ngFor="let banner of bannerData">
    <div class="swiper-zoom-container">
      <img [src]="banner.banners_image"style="min-height: 180px;  border-radius: 20px;
    padding: 10px;   padding-bottom: 0px;"/>
    </div>
  </swiper-slide>
</swiper-container>

<div>
  <h1 style="text-align: center;">Shop By Category</h1>

  <ion-grid>
    <ion-row>
      <ion-col size="4" size-md="4" *ngFor="let category of categories">
        <div class="category-card" routerLink="/product/{{category.id}}/{{category.name}}">
          <div class="image-container">
            <img *ngIf="category.image" [src]="category.image.src" [alt]="category.image.alt"/>
          </div>
          <h2>{{ category.name }}</h2>
        </div>
      </ion-col>
    </ion-row>
    <ion-row *ngIf="categories.length === 0">
      <ion-col size="4" size-md="4" *ngFor="let item of [1,2,3,4,5,6]">
        <div class="category-card">
          <ion-skeleton-text animated style="width: 100%; height: 130px;"></ion-skeleton-text>
        </div>
      </ion-col>
    </ion-row>
  </ion-grid>
  
</div>

<div>
  <!-- <hr style="border-top: 1px solid gray; "> -->

  <h1 style="text-align: center;">Top Rated</h1>

  <ion-grid>
    <ion-row>
      <ion-col size="4" size-md="4" *ngFor="let product of topRatedProducts">
        <div class="product-card" routerLink="/product-detail/{{product.id}}/{{product.name}}" (click)="service.storeProduct(product)">
          <div class="image-container">
            <img  [src]="'https://www.sommedicose.com/wp-content/uploads/2023/08/cropped-sommedicose-default.jpg'"/>
          </div>
          <h2>{{ product.name }}</h2>
        </div>
      </ion-col>
    </ion-row>
    <ion-row *ngIf="!topRatedProducts">
      <ion-col size="4" size-md="4" *ngFor="let item of [1,2,3,4,5,6]">
        <div class="product-card">
          <ion-skeleton-text animated style="width: 100%; height: 145px;"></ion-skeleton-text>
        </div>
      </ion-col>
    </ion-row>
  </ion-grid>
</div>

  
</ion-content>
